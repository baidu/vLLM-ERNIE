[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-ernie"
version = "0.1.0"
description = "vLLM plugin for ERNIE models"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["vllm==0.32.0"]

[project.entry-points."vllm.general_plugins"]
ernie = "vllm_ernie:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vllm_ernie*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["vllm_ernie"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "vllm",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
vllm = ["vllm"]
